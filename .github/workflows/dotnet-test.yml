name: Build and run tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore GeologicalProperties.sln
      - run: dotnet build GeologicalProperties.sln -c Release --no-restore
      - run: dotnet test GeologicalProperties.sln -c Release --no-build
