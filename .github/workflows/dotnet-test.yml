name: Build and run tests

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OSDC_SERVICE_TEST_BASE_URL: http://localhost:8080/
    steps:
      - uses: actions/checkout@v4
      - name: Build service image
        run: docker build --file Service/Dockerfile --tag osdc-geological-properties-service:test .
      - name: Run service container
        run: docker run --detach --name osdc-geological-properties-service-test --publish 8080:8080 osdc-geological-properties-service:test
      - name: Wait for service
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/GeologicalProperties/api/GeologicalProperties > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs osdc-geological-properties-service-test
          exit 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore GeologicalProperties.sln
      - run: dotnet build GeologicalProperties.sln -c Release --no-restore
      - run: dotnet test GeologicalProperties.sln -c Release --no-build
      - name: Show service logs after failure
        if: failure()
        run: docker logs osdc-geological-properties-service-test
      - name: Stop service container
        if: ${{ always() }}
        run: docker rm --force osdc-geological-properties-service-test
